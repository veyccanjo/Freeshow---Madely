name: Publish to WinGet

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download release info
        id: get_release
        run: |
          RELEASE_INFO=$(curl -s https://api.github.com/repos/veyccanjo/Freeshow---Madely/releases/latest)
          TAG=$(echo $RELEASE_INFO | jq -r '.tag_name')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          
          INSTALLER_URL=$(echo $RELEASE_INFO | jq -r '.assets[] | select(.name | contains("FreeShow") and contains("x64") and contains(".exe")) | .browser_download_url' | head -1)
          echo "installer_url=${INSTALLER_URL}" >> $GITHUB_OUTPUT

      - name: WinGet Releaser
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ChurchApps.FreeShow
          token: ${{ secrets.WINGET_PAT }}
          fork-user: vassbo
          urls: ${{ steps.get_release.outputs.installer_url }}
